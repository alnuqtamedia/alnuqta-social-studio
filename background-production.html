<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إنتاج النقطة بالخلفية</title><style>body{background:#071220;color:#fff;font:18px system-ui;max-width:850px;margin:35px auto;padding:20px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #657488;background:#10243a;color:white}button{background:#bf1020;cursor:pointer}a{color:#fff}section{padding:15px;border:1px solid #526070;margin-top:20px}small{display:block;color:#c4ccd5}pre{white-space:pre-wrap}label{display:block}</style>
<h1>النقطة Media — إنتاج بالخلفية</h1><p>المهمة تكمل على عامل الإنتاج حتى بعد إغلاق هذه الصفحة. يتطلب هذا تشغيل العامل وربطه أولاً.</p><a href="index.html">العودة للاستوديو</a>
<form id="connection"><label>رابط عامل الإنتاج<input id="endpoint" type="url" required placeholder="https://production.example.com"></label><label>رمز الوصول<input id="token" type="password" required autocomplete="off"></label><button>اتصال وعرض المهام</button></form>
<form id="production"><label>الأمر<textarea id="command" rows="4" required></textarea></label><label>نص التقرير<textarea id="source" rows="8"></textarea></label><label>المدة بالثواني<input id="duration" type="number" min="10" max="180" value="40" required></label><label>المقاس<select id="orientation"><option value="portrait">عمودي</option><option value="landscape">أفقي</option></select></label><label>الجودة<select id="quality"><option value="720">720p</option><option value="1080">1080p</option></select></label><label>تعليق صوتي مسجل — اختياري<input id="audio" type="file" accept="audio/wav,audio/mpeg,audio/ogg,audio/mp4"></label><small>إذا أرفقت تسجيلاً، نحافظ عليه. اكتب النص المنطوق لضبط المشاهد. لا يُقص أو يُسرّع لإجباره على المدة.</small><button id="submit">بدء الإنتاج</button></form>
<p id="status" role="status"></p><div id="jobs"></div><script src="public/background-production.js"></script></html>
