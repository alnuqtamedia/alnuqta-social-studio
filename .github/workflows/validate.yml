name: Validate Studio

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  creative-browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium and media probe
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Verify real browser creative export
        run: node scripts/test-creative-browser.mjs
      - name: Verify geographic graphics and local FFmpeg export
        run: node scripts/test-illustrated-browser.mjs
      - name: Verify automatic reviewed-media download and persistence
        run: node scripts/test-media-cache-browser.mjs
      - name: Verify persistent library and real mixed-media export
        run: node scripts/test-media-browser.mjs
      - name: Verify scoped illustrative footage and protected specific event
        run: node scripts/test-scope-browser.mjs
      - name: Verify 45-second portrait export
        run: node scripts/test-creative-browser.mjs
        env:
          CINEMA_TEST_SECONDS: 45
          CINEMA_TEST_ORIENTATION: portrait
      - name: Verify 120-second landscape export
        run: node scripts/test-creative-browser.mjs
        env:
          CINEMA_TEST_SECONDS: 120
          CINEMA_TEST_ORIENTATION: landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-browser-proof
          path: |
            artifacts/creative-browser/
            artifacts/illustrated-browser/
            artifacts/media-browser/
            artifacts/scoped-media/
          retention-days: 7
          if-no-files-found: ignore
